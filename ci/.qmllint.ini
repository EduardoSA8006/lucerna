; Níveis do qmllint para o CI. O ci/lint.sh copia este arquivo para a raiz da
; árvore de módulos e falha se o qmllint instalado tiver uma categoria que não
; está aqui. Qualquer aviso reprova (MaxWarnings=0) e todas as categorias estão
; em warning, inclusive as que o qmllint deixa desligadas ou em info por padrão.
; Desligados só os falsos positivos comprovados:
;   UncreatableType: o PanelWindow ganha backend em tempo de execução;
;   UnresolvedType: tipos do Quickshell sem informação completa nos qmltypes;
;   BadSignalHandlerParameters: Process.onExited sem QProcess::ExitStatus nos qmltypes.
; E a exceção medida CompilerWarnings, com o motivo logo acima dela.
[General]
MaxWarnings=0

[Warnings]
AccessSingletonViaObject=warning
AliasCycle=warning
AssignmentInCondition=warning
AttachedPropertyReuse=warning
BadSignalHandlerParameters=disable
Comma=warning
; Exceção medida (Tarefa 7 do plano do CI, qmllint 6.11.2): os avisos do
; compilador de QML para C++ (qmlcachegen), que o Quickshell não usa (carrega o
; QML em tempo de execução). Eram 3536 em 166 arquivos, sem sobreposição:
;   288 "Instruction ... not implemented" (221 de try/catch/finally, 67 de
;       delete, spread e afins): limitação do compilador, sem QML que os tire;
;   139 "... can be shadowed" em tipos do Quickshell e 12 "Cannot resolve the
;       argument type QProcess::ExitStatus": vêm dos qmltypes do Quickshell;
;   989 "from ThemeManager::... with type QObject": somem com a Tarefa 21;
;   151 "Cannot access value for name ...": os mesmos pontos dos unqualified
;       (Tarefas 22 a 27);
;   1856 de tipos (1475 "... QVariant/QJSValue" e 381 de anotação de tipo), em
;       113 arquivos: pedem tipar os dados de modelo e anotar cada função, sem
;       efeito no shell;
;   101 de outros tipos (24 de Anim::tokens com tipo QObject, 10 de
;       QQuickItem::parent, sobrecargas ambíguas).
; Os 439 dos dois primeiros itens (288 + 139 + 12) não têm correção no QML: com
; a categoria ligada, o gate nunca ficaria verde.
CompilerWarnings=disable
ComponentChildrenCount=warning
ConfusingExpressionStatement=warning
ConfusingMinuses=warning
ConfusingPluses=warning
ContextProperties=warning
Deprecated=warning
DuplicateEnumEntries=warning
DuplicateImport=warning
DuplicateInlineComponent=warning
