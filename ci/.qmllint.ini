; Níveis do qmllint para o CI. O ci/lint.sh copia este arquivo para a raiz da
; árvore de módulos e falha se o qmllint instalado tiver uma categoria que não
; está aqui. Qualquer aviso reprova (MaxWarnings=0) e todas as categorias estão
; em warning, inclusive as que o qmllint deixa desligadas ou em info por padrão.
; Desligados só os falsos positivos comprovados:
;   UncreatableType: o PanelWindow ganha backend em tempo de execução;
;   UnresolvedType: tipos do Quickshell sem informação completa nos qmltypes;
;   BadSignalHandlerParameters: Process.onExited sem QProcess::ExitStatus nos qmltypes.
; E a exceção medida CompilerWarnings, com o motivo logo acima dela.
[General]
MaxWarnings=0

[Warnings]
AccessSingletonViaObject=warning
AliasCycle=warning
AssignmentInCondition=warning
AttachedPropertyReuse=warning
BadSignalHandlerParameters=disable
Comma=warning
; Exceção medida (Tarefa 7 do plano do CI, qmllint 6.11.2): são os avisos do
; compilador de QML para C++ (qmlcachegen), que o Quickshell não usa (carrega o
; QML em tempo de execução). Eram 3536 em 166 arquivos. "Instruction ... not
; implemented" (215, quase todos de try/catch) é limitação dele, sem QML que o
; tire; "Member ... of QuickshellGlobal can be shadowed" (42) e "Cannot resolve
; the argument type QProcess::ExitStatus" (12) vêm dos qmltypes do Quickshell;
; o resto pede anotação de tipo em cada função e dados de modelo tipados
; (~1500 "Cannot load property ... from QVariant") em ~130 arquivos, sem efeito
; no shell.
CompilerWarnings=disable
ComponentChildrenCount=warning
ConfusingExpressionStatement=warning
ConfusingMinuses=warning
ConfusingPluses=warning
ContextProperties=warning
Deprecated=warning
DuplicateEnumEntries=warning
DuplicateImport=warning
DuplicateInlineComponent=warning
DuplicatePropertyBinding=warning
DuplicatedName=warning
EnumEntryMatchesEnum=warning
EnumsAreNotTypes=warning
EqualityTypeCoercion=warning
Eval=warning
FunctionUsedBeforeDeclaration=warning
ImportFailure=warning
ImportFileSelector=warning
IncompatibleType=warning
InheritanceCycle=warning
InvalidLintDirective=warning
LintPluginWarnings=warning
LiteralConstructor=warning
MissingEnumEntry=warning
MissingProperty=warning
MissingType=warning
MultilineStrings=warning
NonListProperty=warning
NonRootEnum=warning
PreferNonVarProperties=warning
PrefixedImportType=warning
PropertyOverride=warning
QtDesignStudio.FunctionsNotSupportedInQmlUi=warning
QtDesignStudio.ImperativeCodeNotEditableInVisualDesigner=warning
QtDesignStudio.InvalidIdeInVisualDesigner=warning
QtDesignStudio.ReferenceToParentItemNotSupportedByVisualDesigner=warning
QtDesignStudio.UnsupportedRootTypeInQmlUi=warning
QtDesignStudio.UnsupportedTypeInQmlUi=warning
Quick.Anchors=warning
Quick.AttachedPropertyReuse=warning
Quick.AttachedPropertyType=warning
Quick.Color=warning
Quick.ControlsAttachedPropertyReuse=warning
Quick.ControlsNativeCustomize=warning
Quick.LayoutsPositioning=warning
Quick.PropertyChangesParsed=warning
Quick.StateNoChildItem=warning
Quick.UnexpectedVarType=warning
ReadOnlyProperty=warning
RedundantOptionalChaining=warning
RequiredProperty=warning
Shadow=warning
StalePropertyRead=warning
TopLevelComponent=warning
TranslationFunctionMismatch=warning
UncreatableType=disable
UnintentionalEmptyBlock=warning
UnqualifiedAccess=warning
UnreachableCode=warning
UnresolvedAlias=warning
UnresolvedType=disable
UnterminatedCase=warning
UnusedImports=warning
UseProperFunction=warning
VarUsedBeforeDeclaration=warning
Void=warning
