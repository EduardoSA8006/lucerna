# Cópia de crates/lucernad-spectrum/testdata/pipewire/wireplumber.conf do lucernad (revisão 6bce34f): a fumaça usa o mesmo som isolado da sonda dele.
# Drop-in de wireplumber.conf.d do PipeWire isolado: sem os monitores de
# hardware, o grafo só tem o sink nulo, o microfone falso e os fluxos.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
