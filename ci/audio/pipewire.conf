# Cópia de crates/lucernad-spectrum/testdata/pipewire/pipewire.conf do lucernad (revisão 6bce34f): a fumaça usa o mesmo som isolado da sonda dele.
# Drop-in de pipewire.conf.d do PipeWire isolado (tests/isolado.sh e a fumaça
# do shell): um sink nulo e um microfone falso, sem hardware nenhum. O
# microfone é `Audio/Source/Virtual`: como `Audio/Source`, o item dele trava a
# ativação no WirePlumber 0.5 e nenhum fluxo é ligado (conferido na sonda).
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = lucerna-nulo
            node.description = lucerna-nulo
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            object.linger    = true
        }
    }
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = lucerna-micro
            node.description = lucerna-micro
            media.class      = Audio/Source/Virtual
            audio.position   = [ MONO ]
            object.linger    = true
        }
    }
]
